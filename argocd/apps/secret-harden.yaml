apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-harden
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/secure-aks.git
    targetRevision: master
    path: argocd/manifests/secret-harden
  destination:
    server: https://kubernetes.default.svc
    namespace: harden
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
