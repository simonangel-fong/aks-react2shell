# Deploys the intentionally vulnerable React2Shell app (CVE-2025-55182).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react2shell
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/secure-aks.git
    targetRevision: master
    path: argocd/manifests/react2shell
  destination:
    server: https://kubernetes.default.svc
    namespace: vuln
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
