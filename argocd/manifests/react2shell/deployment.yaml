---
apiVersion: v1
kind: Namespace
metadata:
  name: vuln
---
# Intentionally vulnerable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react2shell
  namespace: vuln
  labels:
    app: react2shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react2shell
  template:
    metadata:
      labels:
        app: react2shell
    spec:
      containers:
        - name: react2shell
          image: simonangelfong/react2shell:vuln
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

