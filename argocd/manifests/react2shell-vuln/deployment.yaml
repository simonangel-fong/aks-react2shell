---
apiVersion: v1
kind: Namespace
metadata:
  name: vuln
---
# Intentionally vulnerable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react2shell
  namespace: vuln
  labels:
    app: react2shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react2shell
  template:
    metadata:
      labels:
        app: react2shell
    spec:
      # Intentional misconfig: pod runs as the frontend SA, so RCE yields its token.
      serviceAccountName: frontend
      containers:
        - name: react2shell
          image: simonangelfong/react2shell:vuln
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Pod-tier crown jewel, exposed in the pod environment (RCE-reachable).
            - name: PWD_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret-pod-vuln
                  key: pwd
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

