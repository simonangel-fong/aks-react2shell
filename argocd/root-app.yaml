# App-of-apps root.
#   kubectl apply -n argocd -f argocd/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-app-of-apps
  namespace: argocd
  finalizers:
   - argocd.argoproj.io/resources-finalizer

spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/secure-aks.git
    targetRevision: master
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
